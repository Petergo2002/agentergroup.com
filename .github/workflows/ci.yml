name: ci

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm --prefix apps/widget-v2 ci

      - run: npm audit --audit-level=moderate

      - run: npm --prefix apps/widget-v2 audit --audit-level=moderate

      - run: npm run lint

      - run: npm test

      - run: npm run build

      - run: npm run widget:build
